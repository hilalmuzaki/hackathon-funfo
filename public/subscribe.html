<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribe Stock Alert Telegram</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 420px; 
      margin: 60px auto; 
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; color: #333; }
    p { color: #666; font-size: 14px; line-height: 1.5; }
    input { 
      padding: 12px; 
      width: 100%; 
      margin: 8px 0 16px; 
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #007bff;
    }
    button { 
      padding: 14px; 
      width: 100%; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #msg { 
      margin-top: 16px; 
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    #msg.success { background: #d4edda; color: #155724; display: block; }
    #msg.error { background: #f8d7da; color: #721c24; display: block; }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: -12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📈 Subscribe Stock Alert</h2>
    <p>Dapatkan alert saham otomatis via Telegram setiap hari jam 08:00 WIB dan deteksi FOMO setiap 15 menit saat market buka.</p>
    
    <label for="userId">User ID</label>
    <input type="number" id="userId" placeholder="Contoh: 123">
    <div class="hint">Dari halaman profile website Funfo</div>
    
    <label for="chatId">Telegram Chat ID</label>
    <input type="text" id="chatId" placeholder="Contoh: 1394104383">
    <div class="hint">Kirim <code>/start</code> ke <a href="https://t.me/userinfobot" target="_blank">@userinfobot</a> di Telegram</div>
    
    <button onclick="subscribe()" id="btn">Subscribe</button>
    <div id="msg"></div>
  </div>

  <script>
    async function subscribe() {
      const userId = document.getElementById('userId').value.trim();
      const chatId = document.getElementById('chatId').value.trim();
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('btn');
      
      if (!userId || !chatId) {
        msgEl.className = 'error';
        msgEl.textContent = '❌ Isi semua field';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Memproses...';
      msgEl.className = '';
      msgEl.textContent = '';

      try {
        const response = await fetch('https://kddpfltcczgwptkrovav.supabase.co/rest/v1/alert_subscriptions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': 'sb_publishable_iF-sOOjfJwL5r0PDPckq7A_t-03Xr9z',
            'Authorization': 'Bearer sb_publishable_iF-sOOjfJwL5r0PDPckq7A_t-03Xr9z',
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify({
            user_id: parseInt(userId),
            telegram_chat_id: parseInt(chatId)
          })
        });

        if (response.ok || response.status === 409) {
          msgEl.className = 'success';
          msgEl.textContent = '✅ Subscribe berhasil! Kamu akan menerima alert saham via Telegram.';
        } else {
          const err = await response.text();
          msgEl.className = 'error';
          msgEl.textContent = '❌ Error: ' + (response.statusText || err);
        }
      } catch (e) {
        msgEl.className = 'error';
        msgEl.textContent = '❌ Network error: ' + e.message;
      }

      btn.disabled = false;
      btn.textContent = 'Subscribe';
    }
  </script>
</body>
</html>
